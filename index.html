<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>UltiClub</title>

<!-- PWA : installable ("Ajouter à l'écran d'accueil"), icône, lancement plein écran, hors-ligne
     après premier chargement (voir sw.js). -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#10151a">
<link rel="icon" href="icons/icon-192.png">
<!-- iOS ignore manifest.json pour l'installation : ces balises sont le seul moyen d'obtenir un
     lancement plein écran (sans Safari) et une icône correcte sur Safari/iOS. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="UltiClub">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #10151a;
    width: 100%;
    height: 100%;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-text-size-adjust: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #placeholder {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: #e8edf2;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }
  #placeholder h1 {
    margin: 0;
    font-size: 2.2em;
    letter-spacing: 0.02em;
  }
  #placeholder p {
    margin: 0;
    color: #8a97a4;
    font-size: 1em;
  }
  #version {
    margin-top: 24px;
    color: #4a5560;
    font-size: 0.8em;
  }
</style>
</head>
<body>
  <div id="placeholder">
    <h1>UltiClub</h1>
    <p>Application de gestion de club -- en construction.</p>
    <span id="version"></span>
  </div>

  <script src="js/version.js"></script>
  <script src="js/main.js"></script>

  <!-- Enregistrement du service worker (voir sw.js) : silencieux si indisponible (ex. chargé
       depuis file:// ou un navigateur trop ancien), l'app marche identiquement sans lui. -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
