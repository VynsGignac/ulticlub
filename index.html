<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>UltiClub</title>

<!-- PWA : installable ("Ajouter à l'écran d'accueil"), icône, lancement plein écran, hors-ligne
     après premier chargement (voir sw.js). -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#10151a">
<link rel="icon" href="icons/icon-192.png">
<!-- iOS ignore manifest.json pour l'installation : ces balises sont le seul moyen d'obtenir un
     lancement plein écran (sans Safari) et une icône correcte sur Safari/iOS. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="UltiClub">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #10151a;
    width: 100%;
    min-height: 100%;
    overscroll-behavior: none;
    -webkit-text-size-adjust: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  .view {
    display: none;
    position: fixed;
    inset: 0;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    color: #e8edf2;
    padding: 24px;
    box-sizing: border-box;
    overflow-y: auto;
  }
  .view.active { display: flex; }

  .view-app {
    align-items: stretch;
    justify-content: flex-start;
    padding: 0;
    gap: 0;
  }
  .app-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid #1f2731;
    flex: 0 0 auto;
  }
  .app-header-profile-button {
    background: transparent;
    border: none;
    padding: 0;
    text-align: left;
    cursor: pointer;
    color: inherit;
    font: inherit;
    display: block;
  }
  .app-header-profile-button:active { opacity: 0.7; }
  .app-header-actions {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .header-icon-button {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 1px solid #2a333c;
    background: #1a2028;
    color: #e8edf2;
    font-weight: 700;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .app-club-label {
    display: block;
    color: #8a97a4;
    font-size: 0.85em;
    margin-top: 2px;
  }
  .app-tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 12px;
    border-bottom: 1px solid #1f2731;
    flex: 0 0 auto;
    -webkit-overflow-scrolling: touch;
  }
  .tab-button {
    flex: 0 0 auto;
    background: #1a2028;
    border: 1px solid #2a333c;
    color: #8a97a4;
    border-radius: 20px;
    padding: 8px 16px;
    font-size: 0.9em;
    white-space: nowrap;
  }
  .tab-button.active {
    background: #3b82f6;
    border-color: #3b82f6;
    color: white;
    font-weight: 600;
  }
  .app-tab-content {
    flex: 1;
    padding: 32px 20px;
    color: #8a97a4;
    text-align: center;
  }
  .tab-content-profil {
    flex: 1;
    overflow-y: auto;
    box-sizing: border-box;
    padding: 24px 20px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }
  .dashboard-subtab-panel {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }
  .profil-clubs h2 { margin-bottom: 4px; }
  .club-results li.highlight {
    border-color: #3b82f6;
    color: #e8edf2;
  }

  .tab-content-gestion-equipe {
    flex: 1;
    overflow-y: auto;
    box-sizing: border-box;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }
  .subtabs {
    display: flex;
    gap: 8px;
    width: 100%;
    max-width: 360px;
    border-bottom: 1px solid #1f2731;
  }
  .subtab-button {
    flex: 1;
    background: transparent;
    border: none;
    border-radius: 0;
    border-bottom: 2px solid transparent;
    color: #8a97a4;
    padding: 10px 8px;
    font-size: 0.9em;
  }
  .subtab-button.active {
    color: #e8edf2;
    border-bottom-color: #3b82f6;
    font-weight: 600;
  }
  .subtab-panel {
    width: 100%;
    max-width: 360px;
  }

  .tab-content-team-detail {
    flex: 1;
    overflow-y: auto;
    box-sizing: border-box;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }
  .action-button {
    background: #1a2028;
    border: 1px solid #2a333c;
    color: #e8edf2;
    text-align: left;
    font-size: 0.95em;
  }
  .action-button:hover { border-color: #3b82f6; }
  .action-button.highlight {
    border-color: #3b82f6;
    background: #1e2a3d;
    color: #e8edf2;
  }
  .saison-item-actions {
    display: flex;
    gap: 8px;
    margin-top: 8px;
  }
  .saison-item-actions .action-button {
    flex: 1;
    text-align: center;
  }
  .team-detail-content {
    width: 100%;
    max-width: 360px;
  }

  .filter-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    width: 100%;
  }
  /* Regroupe un bandeau de filtres fixe (voir .sticky-filters) et la liste qu'il surplombe dans un
     seul conteneur SANS espacement entre les deux (gap: 0) -- le gap habituel de .panel entre ses
     enfants laisserait sinon une bande transparente juste sous le bandeau, par laquelle la liste
     defilant en dessous resterait visible/semblerait "deborder" par-dessus (constate sur appareil
     reel : un negative margin pour compenser le gap du parent s'est avere peu fiable selon les
     moteurs de rendu, d'ou ce conteneur dedie plutot qu'un correctif au bandeau lui-meme).
  */
  .list-with-sticky-header {
    display: flex;
    flex-direction: column;
    gap: 0;
    width: 100%;
  }
  /* Regroupe filter-row et tout autre controle de filtre (ex. le champ "Dette superieure a" dans
     Administratif) pour qu'ils restent fixes ensemble en haut de la fenetre pendant le defilement
     de la liste en dessous -- comme une ligne figee. */
  .sticky-filters {
    position: sticky;
    /* #app-modal-body a son propre padding-top (16px) : ce padding, porte par l'element qui
       scrolle lui-meme, reste visible comme une bande non couverte au-dessus d'un enfant sticky
       avec top:0 -- constate sur appareil reel, un reste de la ligne precedente y apparaissait.
       On decale le point d'accroche de -16px (jusqu'au vrai bord du viewport) et on agrandit
       d'autant le padding-top du bandeau pour qu'il couvre toujours la meme zone en bas. */
    top: -16px;
    z-index: 5;
    background: #10151a;
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
    padding: 26px 0 12px;
    border-bottom: 1px solid #1f2731;
  }
  .filter-chip {
    background: #1a2028;
    border: 1px solid #2a333c;
    color: #8a97a4;
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 0.85em;
  }
  .filter-chip.active {
    background: #3b82f6;
    border-color: #3b82f6;
    color: white;
    font-weight: 600;
  }
  .debt-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    cursor: default;
  }
  .debt-row input {
    width: 100px;
    text-align: right;
    flex: 0 0 auto;
  }

  .communication-body {
    white-space: pre-wrap;
    color: #e8edf2;
    text-align: left;
    width: 100%;
  }
  .communication-meta {
    color: #8a97a4;
    font-size: 0.85em;
  }

  .tab-content-event-create {
    flex: 1;
    overflow-y: auto;
    box-sizing: border-box;
    padding: 24px 20px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  .tab-content-calendrier {
    flex: 1;
    overflow-y: auto;
    box-sizing: border-box;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .calendrier-header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    width: 100%;
    max-width: 360px;
  }
  .calendrier-header span {
    font-weight: 600;
    color: #e8edf2;
    min-width: 140px;
    text-align: center;
  }
  .calendrier-header button {
    padding: 4px 14px;
    font-size: 1.3em;
    line-height: 1;
  }
  .calendrier-grid {
    display: grid;
    grid-template-columns: auto repeat(7, 1fr);
    gap: 4px;
    width: 100%;
    max-width: 360px;
  }
  .calendrier-weekday {
    text-align: center;
    font-size: 0.75em;
    color: #8a97a4;
    padding-bottom: 4px;
  }
  .calendrier-weeknum {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 6px;
    font-size: 0.75em;
    color: #4a5560;
  }
  .calendrier-day {
    position: relative;
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    background: #1a2028;
    border: 1px solid #2a333c;
    color: #e8edf2;
    font-size: 0.9em;
    box-sizing: border-box;
  }
  .calendrier-day.has-event::after {
    content: '';
    position: absolute;
    bottom: 5px;
    left: 50%;
    transform: translateX(-50%);
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #3b82f6;
  }
  .calendrier-day.outside {
    color: #4a5560;
    background: transparent;
    border-color: transparent;
  }
  .calendrier-day.today {
    border-color: #3b82f6;
    background: #1e2a3d;
    font-weight: 700;
  }
  .calendrier-day.has-event { cursor: pointer; }
  #calendrier-day-detail {
    width: 100%;
    max-width: 360px;
  }
  .event-detail-item { cursor: default; }

  .app-modal-overlay {
    position: fixed;
    inset: 0;
    background: #10151a;
    z-index: 90;
  }
  .app-modal-panel {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
  }
  .app-modal-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    border-bottom: 1px solid #1f2731;
    flex: 0 0 auto;
  }
  .app-modal-header h2 {
    margin: 0;
    font-size: 1.1em;
    text-align: left;
    flex: 1;
  }
  .app-modal-close {
    background: transparent;
    border: none;
    color: #3b82f6;
    font-size: 1em;
    font-weight: 600;
    line-height: 1;
    padding: 4px 4px 4px 0;
    cursor: pointer;
    white-space: nowrap;
  }
  .app-modal-body {
    padding: 16px 20px 24px;
    overflow-y: auto;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .floating-fab {
    position: fixed;
    bottom: 24px;
    right: 20px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #3b82f6;
    color: white;
    font-size: 1.4em;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.45);
    z-index: 50;
    padding: 0;
  }
  .fab-badge {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: #ef4444;
    border: 2px solid #10151a;
  }

  .tab-content-communications {
    flex: 1;
    overflow-y: auto;
    box-sizing: border-box;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  h1 {
    margin: 0;
    font-size: 1.8em;
    letter-spacing: 0.02em;
    text-align: center;
  }
  h2 {
    margin: 0;
    font-size: 1.3em;
    text-align: center;
    color: #e8edf2;
  }

  form, .panel {
    width: 100%;
    max-width: 320px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .club-results {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 100%;
  }
  /* Seule la liste de recherche de club (avant connexion) reste volontairement compacte, affichee
     sous un champ de recherche plutot que plein ecran -- toutes les autres listes (Gestion club,
     Saison, detail d'equipe...) doivent prendre toute la hauteur disponible de leur conteneur. */
  #club-results {
    max-height: 240px;
    overflow-y: auto;
  }
  .club-results li {
    padding: 10px 12px;
    border-radius: 8px;
    background: #1a2028;
    border: 1px solid #2a333c;
    cursor: pointer;
  }
  .club-results li:hover { border-color: #3b82f6; }
  .member-name-link {
    cursor: pointer;
  }
  .member-name-link:hover {
    text-decoration: underline;
  }
  .club-results li.empty {
    color: #4a5560;
    text-align: center;
    cursor: default;
    background: transparent;
    border: none;
  }

  label {
    font-size: 0.85em;
    color: #8a97a4;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  input:not([type="checkbox"]), select, textarea {
    font-size: 1em;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #2a333c;
    background: #1a2028;
    color: #e8edf2;
    box-sizing: border-box;
    touch-action: manipulation;
    font-family: inherit;
    resize: vertical;
  }
  input:not([type="checkbox"]):focus, select:focus, textarea:focus { outline: 2px solid #3b82f6; }
  input:not([type="checkbox"]):disabled { opacity: 0.6; }

  .checkbox-label {
    flex-direction: row;
    align-items: center;
    gap: 8px;
    font-size: 0.8em;
    margin-top: -6px;
  }
  .checkbox-label input[type="checkbox"] {
    width: 16px;
    height: 16px;
    flex: 0 0 auto;
    accent-color: #3b82f6;
    cursor: pointer;
  }

  .password-field {
    position: relative;
    display: flex;
  }
  .password-field input { flex: 1; padding-right: 44px; }
  .toggle-password {
    position: absolute;
    right: 4px;
    top: 50%;
    transform: translateY(-50%);
    background: transparent;
    border: none;
    padding: 6px 8px;
    font-size: 1.1em;
    line-height: 1;
    color: #8a97a4;
    cursor: pointer;
  }

  button {
    font-size: 1em;
    padding: 12px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    touch-action: manipulation;
  }
  button[type="submit"] {
    background: #3b82f6;
    color: white;
    font-weight: 600;
    margin-top: 4px;
  }
  button[type="submit"]:disabled { opacity: 0.6; }
  button.link {
    background: transparent;
    color: #8a97a4;
    text-decoration: underline;
    padding: 4px;
  }

  .message {
    min-height: 1.2em;
    font-size: 0.85em;
    text-align: center;
    color: #6ee787;
  }
  .message.error { color: #f87171; }

  #version {
    position: fixed;
    bottom: 10px;
    color: #4a5560;
    font-size: 0.75em;
  }
</style>
</head>
<body>

  <div id="view-login" class="view active">
    <h1>UltiClub</h1>
    <form id="login-form">
      <label>
        Adresse mail
        <input id="login-email" type="email" autocomplete="email" required>
      </label>
      <label>
        Mot de passe
        <div class="password-field">
          <input id="login-password" type="password" autocomplete="current-password" required>
          <button type="button" class="toggle-password" data-target="login-password" aria-label="Afficher le mot de passe">👁</button>
        </div>
      </label>
      <p id="login-info" class="message"></p>
      <p id="login-error" class="message error"></p>
      <button type="submit">Se connecter</button>
      <button type="button" id="show-signup" class="link">Nouvel utilisateur ?</button>
    </form>
  </div>

  <div id="view-signup" class="view">
    <h2>Création de profil</h2>
    <form id="signup-form">
      <label>
        Nom
        <input id="signup-nom" type="text" autocomplete="name" required>
      </label>
      <label>
        Pseudo
        <input id="signup-pseudo" type="text" autocomplete="username" required>
      </label>
      <label>
        Mot de passe
        <div class="password-field">
          <input id="signup-password" type="password" autocomplete="new-password" minlength="6" required>
          <button type="button" class="toggle-password" data-target="signup-password" aria-label="Afficher le mot de passe">👁</button>
        </div>
      </label>
      <label>
        Adresse mail
        <input id="signup-email" type="email" autocomplete="email" required>
      </label>
      <p id="signup-error" class="message error"></p>
      <button type="submit">Créer le compte</button>
      <button type="button" id="show-login" class="link">Retour à la connexion</button>
    </form>
  </div>

  <div id="view-club-select" class="view">
    <h1>UltiClub</h1>
    <div class="panel">
      <label>
        Rechercher un club
        <input id="club-search" type="text" placeholder="Nom du club...">
      </label>
      <ul id="club-results" class="club-results"></ul>
      <p id="club-select-error" class="message error"></p>
      <button type="button" id="show-club-create" class="link">Créer un club</button>
      <button type="button" id="club-select-logout" class="link">Se déconnecter</button>
    </div>
  </div>

  <div id="view-club-create" class="view">
    <h2>Créer un club</h2>
    <form id="club-create-form">
      <label>
        Nom du club
        <input id="club-create-nom" type="text" required>
      </label>
      <p id="club-create-error" class="message error"></p>
      <button type="submit">Créer</button>
      <button type="button" id="show-club-select" class="link">Retour</button>
    </form>
  </div>

  <div id="view-app" class="view view-app">
    <div class="app-header">
      <button type="button" id="app-header-profile-button" class="app-header-profile-button">
        <strong id="app-pseudo"></strong>
        <span class="app-club-label">Club : <strong id="app-club"></strong></span>
      </button>
      <div class="app-header-actions">
        <button type="button" id="help-menu-button" class="header-icon-button" aria-label="Aide">?</button>
        <button type="button" id="logout-button" class="link">Se déconnecter</button>
      </div>
    </div>
    <nav id="app-tabs" class="app-tabs"></nav>
    <div id="app-tab-content" class="app-tab-content"></div>

    <div id="tab-content-calendrier" class="tab-content-calendrier" style="display: none;">
      <div class="calendrier-header">
        <button type="button" id="calendrier-prev" class="link">‹</button>
        <span id="calendrier-label"></span>
        <button type="button" id="calendrier-next" class="link">›</button>
      </div>
      <div id="calendrier-grid" class="calendrier-grid"></div>
      <div id="calendrier-day-detail" class="panel" style="display: none;"></div>
    </div>

    <div id="tab-content-saison" class="tab-content-team-detail" style="display: none;">
      <h2>Saison</h2>
      <div id="saison-content" class="team-detail-content"></div>
    </div>

    <div id="tab-content-gestion-equipe" class="tab-content-gestion-equipe" style="display: none;">
      <ul id="equipes-list" class="club-results"></ul>
    </div>

    <div id="tab-content-team-detail" class="tab-content-team-detail" style="display: none;">
      <h2 id="team-detail-title"></h2>
      <div id="team-detail-actions" class="team-detail-actions panel">
        <button type="button" id="team-action-members" class="action-button">Afficher la liste des membres</button>
        <button type="button" id="team-action-add-members" class="action-button">Ajouter des membres</button>
        <button type="button" id="team-action-managers" class="action-button">Gérer les responsables</button>
        <button type="button" id="team-action-create-event" class="action-button">Créer un événement</button>
        <button type="button" id="team-action-view-events" class="action-button">Voir les événements</button>
        <button type="button" id="team-action-selections" class="action-button">Gérer les sélections</button>
      </div>
      <div id="team-detail-readonly" class="team-detail-content" style="display: none;"></div>
    </div>

    <div id="tab-content-event-create" class="tab-content-event-create" style="display: none;">
      <h2>Créer un événement</h2>
      <form id="event-create-form" class="panel">
        <label>
          Nom de l'événement
          <input id="event-nom" type="text" required>
        </label>
        <label>
          Date de début
          <input id="event-date-debut" type="date" required>
        </label>
        <label>
          Date de fin (optionnel, = date de début si vide)
          <input id="event-date-fin" type="date">
        </label>
        <label>
          Heure de début
          <input id="event-heure-debut" type="time" required>
        </label>
        <label>
          Heure de fin (optionnel, = heure de début si vide)
          <input id="event-heure-fin" type="time">
        </label>
        <label>
          Lieu (optionnel)
          <input id="event-lieu" type="text">
        </label>
        <label>
          Commentaire
          <textarea id="event-commentaire" rows="3"></textarea>
        </label>
        <label class="checkbox-label">
          <input id="event-cyclique" type="checkbox">
          Cyclique (toutes les semaines)
        </label>
        <label id="event-derniere-occurrence-label" style="display: none;">
          Date de dernière occurrence
          <input id="event-derniere-occurrence" type="date">
        </label>
        <label class="checkbox-label">
          <input id="event-demande-confirmation" type="checkbox">
          Demander confirmation
        </label>
        <p id="event-create-info" class="message"></p>
        <p id="event-create-error" class="message error"></p>
        <button type="submit">Créer l'événement</button>
        <button type="button" id="event-create-back" class="link">Retour</button>
      </form>
    </div>

    <div id="tab-content-selection-create" class="tab-content-event-create" style="display: none;">
      <h2>Gérer les sélections</h2>
      <form id="selection-create-form" class="panel">
        <label>
          Date limite candidature
          <input id="selection-date-limite" type="date" required>
        </label>
        <label>
          Commentaire
          <textarea id="selection-commentaire" rows="3"></textarea>
        </label>
        <p id="selection-create-info" class="message"></p>
        <p id="selection-create-error" class="message error"></p>
        <button type="submit">Créer la sélection</button>
        <button type="button" id="selection-create-back" class="link">Retour</button>
      </form>
    </div>

    <div id="tab-content-gestion-club" class="tab-content-team-detail" style="display: none;">
      <h2 id="club-detail-title"></h2>
      <div class="team-detail-actions panel">
        <button type="button" id="club-action-members-manage" class="action-button">Gestion membre</button>
        <button type="button" id="club-action-admin" class="action-button">Administratif</button>
        <button type="button" id="club-action-create-team" class="action-button">Créer une équipe</button>
        <button type="button" id="club-action-events" class="action-button">Événement club</button>
      </div>
    </div>

    <div id="tab-content-profil" class="tab-content-profil" style="display: none;">
      <nav class="subtabs">
        <button type="button" class="subtab-button" data-subtab="profil">Profil</button>
        <button type="button" class="subtab-button" data-subtab="administratif">Administratif</button>
      </nav>

      <div id="dashboard-subtab-profil" class="dashboard-subtab-panel">
      <form id="profil-form" class="panel">
        <h2>Mes informations</h2>
        <label>
          Pseudo
          <input id="profil-pseudo" type="text" required>
        </label>
        <label>
          Prénom
          <input id="profil-prenom" type="text">
        </label>
        <label>
          Nom
          <input id="profil-nom" type="text" required>
        </label>
        <label>
          Adresse mail
          <input id="profil-email" type="email" disabled>
        </label>
        <label class="checkbox-label">
          <input id="profil-email-visible" type="checkbox" checked>
          Visible par les membres hors du bureau
        </label>
        <label>
          Numéro de téléphone
          <input id="profil-telephone" type="tel">
        </label>
        <label class="checkbox-label">
          <input id="profil-telephone-visible" type="checkbox" checked>
          Visible par les membres hors du bureau
        </label>
        <label>
          Adresse
          <input id="profil-adresse" type="text">
        </label>
        <label class="checkbox-label">
          <input id="profil-adresse-visible" type="checkbox" checked>
          Visible par les membres hors du bureau
        </label>
        <label>
          Date de naissance
          <input id="profil-date-naissance" type="date">
        </label>
        <label class="checkbox-label">
          <input id="profil-date-naissance-visible" type="checkbox" checked>
          Visible par les membres hors du bureau
        </label>
        <p id="profil-info" class="message"></p>
        <p id="profil-error" class="message error"></p>
        <button type="submit">Enregistrer</button>
      </form>

      <div class="panel profil-clubs">
        <h2>Mes clubs</h2>
        <ul id="profil-club-list" class="club-results"></ul>
        <button type="button" id="profil-leave-club" class="link"></button>
        <button type="button" id="profil-switch-club" class="link">Basculer vers un autre club</button>
        <ul id="profil-switch-list" class="club-results" style="display: none;"></ul>
      </div>
      </div>

      <div id="dashboard-subtab-administratif" class="dashboard-subtab-panel" style="display: none;">
        <div class="panel">
          <h2>Administratif</h2>
          <label class="checkbox-label">
            <input id="dashboard-licence-a-jour" type="checkbox" disabled>
            Licence à jour
          </label>
          <label>
            Dette
            <input id="dashboard-dette" type="text" disabled>
          </label>
        </div>
      </div>
    </div>

    <div id="tab-content-communications" class="tab-content-communications" style="display: none;">
      <h2>Communications</h2>
      <div id="communications-content" class="team-detail-content"></div>
    </div>

    <button type="button" id="communications-fab" class="floating-fab" aria-label="Communications">
      ✉️
      <span id="communications-fab-badge" class="fab-badge" style="display: none;"></span>
    </button>

    <div id="app-modal-overlay" class="app-modal-overlay" style="display: none;">
      <div class="app-modal-panel">
        <div class="app-modal-header">
          <button type="button" id="app-modal-close" class="app-modal-close" aria-label="Retour">‹ Retour</button>
          <h2 id="app-modal-title"></h2>
        </div>
        <div id="app-modal-body" class="app-modal-body"></div>
      </div>
    </div>
  </div>

  <!-- Enregistrement du service worker (voir sw.js) : silencieux si indisponible (ex. chargé
       depuis file:// ou un navigateur trop ancien), l'app marche identiquement sans lui. -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
