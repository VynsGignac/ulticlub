<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>UltiClub</title>

<!-- PWA : installable ("Ajouter à l'écran d'accueil"), icône, lancement plein écran, hors-ligne
     après premier chargement (voir sw.js). -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#10151a">
<link rel="icon" href="icons/icon-192.png">
<!-- iOS ignore manifest.json pour l'installation : ces balises sont le seul moyen d'obtenir un
     lancement plein écran (sans Safari) et une icône correcte sur Safari/iOS. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="UltiClub">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #10151a;
    width: 100%;
    min-height: 100%;
    overscroll-behavior: none;
    -webkit-text-size-adjust: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  .view {
    display: none;
    position: fixed;
    inset: 0;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    color: #e8edf2;
    padding: 24px;
    box-sizing: border-box;
    overflow-y: auto;
  }
  .view.active { display: flex; }

  .view-app {
    align-items: stretch;
    justify-content: flex-start;
    padding: 0;
    gap: 0;
  }
  .app-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid #1f2731;
    flex: 0 0 auto;
  }
  .app-club-label {
    display: block;
    color: #8a97a4;
    font-size: 0.85em;
    margin-top: 2px;
  }
  .app-tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 12px;
    border-bottom: 1px solid #1f2731;
    flex: 0 0 auto;
    -webkit-overflow-scrolling: touch;
  }
  .tab-button {
    flex: 0 0 auto;
    background: #1a2028;
    border: 1px solid #2a333c;
    color: #8a97a4;
    border-radius: 20px;
    padding: 8px 16px;
    font-size: 0.9em;
    white-space: nowrap;
  }
  .tab-button.active {
    background: #3b82f6;
    border-color: #3b82f6;
    color: white;
    font-weight: 600;
  }
  .app-tab-content {
    flex: 1;
    padding: 32px 20px;
    color: #8a97a4;
    text-align: center;
  }

  h1 {
    margin: 0;
    font-size: 1.8em;
    letter-spacing: 0.02em;
    text-align: center;
  }
  h2 {
    margin: 0;
    font-size: 1.3em;
    text-align: center;
    color: #e8edf2;
  }

  form, .panel {
    width: 100%;
    max-width: 320px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .club-results {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 240px;
    overflow-y: auto;
  }
  .club-results li {
    padding: 10px 12px;
    border-radius: 8px;
    background: #1a2028;
    border: 1px solid #2a333c;
    cursor: pointer;
  }
  .club-results li:hover { border-color: #3b82f6; }
  .club-results li.empty {
    color: #4a5560;
    text-align: center;
    cursor: default;
    background: transparent;
    border: none;
  }

  label {
    font-size: 0.85em;
    color: #8a97a4;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  input {
    font-size: 1em;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #2a333c;
    background: #1a2028;
    color: #e8edf2;
    box-sizing: border-box;
    touch-action: manipulation;
  }
  input:focus { outline: 2px solid #3b82f6; }

  .password-field {
    position: relative;
    display: flex;
  }
  .password-field input { flex: 1; padding-right: 44px; }
  .toggle-password {
    position: absolute;
    right: 4px;
    top: 50%;
    transform: translateY(-50%);
    background: transparent;
    border: none;
    padding: 6px 8px;
    font-size: 1.1em;
    line-height: 1;
    color: #8a97a4;
    cursor: pointer;
  }

  button {
    font-size: 1em;
    padding: 12px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    touch-action: manipulation;
  }
  button[type="submit"] {
    background: #3b82f6;
    color: white;
    font-weight: 600;
    margin-top: 4px;
  }
  button[type="submit"]:disabled { opacity: 0.6; }
  button.link {
    background: transparent;
    color: #8a97a4;
    text-decoration: underline;
    padding: 4px;
  }

  .message {
    min-height: 1.2em;
    font-size: 0.85em;
    text-align: center;
    color: #6ee787;
  }
  .message.error { color: #f87171; }

  #version {
    position: fixed;
    bottom: 10px;
    color: #4a5560;
    font-size: 0.75em;
  }
</style>
</head>
<body>

  <div id="view-login" class="view active">
    <h1>UltiClub</h1>
    <form id="login-form">
      <label>
        Adresse mail
        <input id="login-email" type="email" autocomplete="email" required>
      </label>
      <label>
        Mot de passe
        <div class="password-field">
          <input id="login-password" type="password" autocomplete="current-password" required>
          <button type="button" class="toggle-password" data-target="login-password" aria-label="Afficher le mot de passe">👁</button>
        </div>
      </label>
      <p id="login-info" class="message"></p>
      <p id="login-error" class="message error"></p>
      <button type="submit">Se connecter</button>
      <button type="button" id="show-signup" class="link">Nouvel utilisateur ?</button>
    </form>
  </div>

  <div id="view-signup" class="view">
    <h2>Création de profil</h2>
    <form id="signup-form">
      <label>
        Nom
        <input id="signup-nom" type="text" autocomplete="name" required>
      </label>
      <label>
        Pseudo
        <input id="signup-pseudo" type="text" autocomplete="username" required>
      </label>
      <label>
        Mot de passe
        <div class="password-field">
          <input id="signup-password" type="password" autocomplete="new-password" minlength="6" required>
          <button type="button" class="toggle-password" data-target="signup-password" aria-label="Afficher le mot de passe">👁</button>
        </div>
      </label>
      <label>
        Adresse mail
        <input id="signup-email" type="email" autocomplete="email" required>
      </label>
      <p id="signup-error" class="message error"></p>
      <button type="submit">Créer le compte</button>
      <button type="button" id="show-login" class="link">Retour à la connexion</button>
    </form>
  </div>

  <div id="view-club-select" class="view">
    <h1>UltiClub</h1>
    <div class="panel">
      <label>
        Rechercher un club
        <input id="club-search" type="text" placeholder="Nom du club...">
      </label>
      <ul id="club-results" class="club-results"></ul>
      <p id="club-select-error" class="message error"></p>
      <button type="button" id="show-club-create" class="link">Créer un club</button>
    </div>
  </div>

  <div id="view-club-create" class="view">
    <h2>Créer un club</h2>
    <form id="club-create-form">
      <label>
        Nom du club
        <input id="club-create-nom" type="text" required>
      </label>
      <p id="club-create-error" class="message error"></p>
      <button type="submit">Créer</button>
      <button type="button" id="show-club-select" class="link">Retour</button>
    </form>
  </div>

  <div id="view-app" class="view view-app">
    <div class="app-header">
      <div>
        <strong id="app-pseudo"></strong>
        <span class="app-club-label">Club : <strong id="app-club"></strong></span>
      </div>
      <button type="button" id="logout-button" class="link">Se déconnecter</button>
    </div>
    <nav id="app-tabs" class="app-tabs"></nav>
    <div id="app-tab-content" class="app-tab-content"></div>
  </div>

  <span id="version"></span>

  <script src="js/version.js"></script>
  <script src="js/vendor/supabase.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/club.js"></script>
  <script src="js/tabs.js"></script>
  <script src="js/main.js"></script>

  <!-- Enregistrement du service worker (voir sw.js) : silencieux si indisponible (ex. chargé
       depuis file:// ou un navigateur trop ancien), l'app marche identiquement sans lui. -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
